apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: agent-core-tests
  description: "agent-core's tests: the compiled tool policy under Node, the agent loop against a mock model, the model router, the SSRF guard, Slack signatures and prompts"
spec:
  type: turbo-package
  lifecycle: production
  owner: platform
  docs:
    overview: docs/overview.md
    pages:
      - { path: docs/architecture.md, role: architecture, title: Architecture }
      - { path: docs/runbook.md, role: runbook, title: Runbook }
  domain: agentdesk-agents
  subscribe:
    environments:
      - name: dev
        profile: quick-check
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"
    buildCommand: pnpm exec turbo run build --filter=./
    typecheckCommand: pnpm exec turbo run typecheck --filter=./
    preBuildCommand: pnpm exec turbo run test --filter=./
  labels:
    team: platform
    layer: test
    surface: agents
