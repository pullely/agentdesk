apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: connectors-worker-tests
  description: "connectors-worker's tests: SSRF refusals, discovery over Streamable HTTP (JSON and SSE), bearer tokens in the vault, sync with changed-description detection, and granted calls through McpSession"
spec:
  type: turbo-package
  lifecycle: production
  owner: platform
  docs:
    overview: docs/overview.md
    pages:
      - { path: docs/architecture.md, role: architecture, title: Architecture }
      - { path: docs/runbook.md, role: runbook, title: Runbook }
  domain: agentdesk-agents
  subscribe:
    environments:
      - name: dev
        profile: quick-check
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"
    buildCommand: pnpm exec turbo run build --filter=./
    typecheckCommand: pnpm exec turbo run typecheck --filter=./
    preBuildCommand: pnpm exec turbo run test --filter=./
  labels:
    team: platform
    layer: test
    surface: agents
