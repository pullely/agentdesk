apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: agent-core
  description: "The agent loop agentdesk's runtime and playground share: the ported ai-slackbot loop, the OPA policy WASM, the model router, built-in tools, Slack signatures and the SSRF guard"
spec:
  type: turbo-package
  lifecycle: production
  owner: platform
  docs:
    overview: docs/overview.md
    pages:
      - { path: docs/architecture.md, role: architecture, title: Architecture }
      - { path: docs/runbook.md, role: runbook, title: Runbook }
  domain: agentdesk-agents
  subscribe:
    environments:
      - name: dev
        profile: quick-check
      - name: stage
        profile: quick-check
      - name: prod
        profile: quick-check
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"
    buildCommand: pnpm exec turbo run build --filter=./
    typecheckCommand: pnpm exec turbo run typecheck --filter=./
  labels:
    team: platform
    layer: shared
    surface: agents
